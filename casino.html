<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Блокируем зум для мобилок -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 КАЗИНО 777 - ЗАБЕРИ СВОЙ БОНУС! 🎰</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #4a0000 0%, #000000 100%);
            color: #ffd700;
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .gold-text {
            color: #ffd700;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0px 4px 10px #ffaa00;
        }

        .header {
            font-size: 3em;
            margin-top: 20px;
            animation: flashWarning 0.5s infinite alternate;
        }

        @keyframes flashWarning {
            0% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
            100% { color: #ffd700; text-shadow: 0 0 20px #ffaa00; }
        }

        .bonus-box {
            background: rgba(0, 0, 0, 0.8);
            border: 5px solid #ffd700;
            border-radius: 15px;
            width: 80%;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            box-shadow: 0 0 30px #ffd700;
            box-sizing: border-box;
        }

        .jackpot-container {
            font-size: 4em;
            color: #00ff00;
            text-shadow: 0 0 15px #00ff00;
            margin: 20px 0;
        }

        .slots {
            font-size: 5em;
            letter-spacing: 20px;
            margin: 20px 0;
            text-shadow: 5px 5px 15px rgba(0,0,0,0.8);
            white-space: nowrap; /* Чтобы слоты не переносились на новую строку */
        }

        .cta-btn {
            background: linear-gradient(to bottom, #ff0000, #990000);
            border: 5px solid #ffd700;
            color: white;
            font-size: 3em;
            font-weight: bold;
            padding: 20px 50px;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.5);
            animation: pulseBtn 0.5s infinite alternate;
            box-sizing: border-box;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 10px #ff0000; }
            100% { transform: scale(1.1); box-shadow: 0 0 40px #ff0000, 0 0 60px #ffd700; }
        }

        .winner-popup {
            position: absolute;
            bottom: -150px;
            left: 20px;
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: bottom 0.5s ease-out;
            box-shadow: 0 0 15px #00ff00;
            z-index: 100;
            box-sizing: border-box;
        }

        .winner-popup.show {
            bottom: 20px;
        }

        .timer {
            font-family: monospace;
            background: red;
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 1.5em;
            margin-top: 15px;
        }

        /* МОБИЛЬНЫЙ АДАПТИВ */
        @media (max-width: 600px) {
            .header {
                font-size: 1.8em;
                margin-top: 10px;
                padding: 0 10px;
            }
            .bonus-box {
                width: 95%;
                padding: 15px;
                margin: 10px auto;
            }
            .gold-text {
                font-size: 1.8em !important;
            }
            .bonus-box h3 {
                font-size: 1.1em;
            }
            .jackpot-container {
                font-size: 2.2em;
                margin: 15px 0;
            }
            .slots {
                font-size: 2.5em;
                letter-spacing: 5px;
                margin: 15px 0;
            }
            .cta-btn {
                font-size: 1.8em;
                padding: 15px 10px;
                width: 100%;
            }
            .winner-popup {
                left: 5%;
                width: 90%;
                justify-content: center; /* Центрируем контент попапа на мобилках */
            }
            .timer {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>

    <h1 class="header">⚠️ ВАШ IP АДРЕС ВЫБРАН! ⚠️</h1>

    <div class="bonus-box">
        <h2 class="gold-text" style="font-size: 2.5em; margin: 0;">🎁 БОНУС 500% НА ПЕРВЫЙ ДЕПОЗИТ 🎁</h2>
        <h3 style="color: #fff; margin-top: 10px;">+ 250 БЕСПЛАТНЫХ ВРАЩЕНИЙ</h3>
        
        <div class="jackpot-container">
            ДЖЕКПОТ: <br> <span id="jackpot">14 582 930</span> ₽
        </div>

        <div class="slots" id="slots">🎰 🍒 💎 7️⃣</div>

        <button class="cta-btn" onclick="trollClick()">КРУТИТЬ И ЗАБРАТЬ!</button>
        
        <br>
        <div class="timer">ПРЕДЛОЖЕНИЕ СГОРИТ ЧЕРЕЗ: <span id="countdown">03:00</span></div>
    </div>

    <!-- Всплывающее окно фейкового победителя -->
    <div id="winner-popup" class="winner-popup">
        <span style="font-size: 2em;">🤑</span>
        <div>
            <span id="winner-name" style="color: #ffd700;">Игрок777</span> только что выиграл<br>
            <span id="winner-amount" style="color: #00ff00; font-size: 1.2em;">50 000 ₽</span>
        </div>
    </div>

    <script>
        let jackpot = 14582930;
        setInterval(() => {
            jackpot += Math.floor(Math.random() * 500) + 100;
            document.getElementById('jackpot').innerText = jackpot.toLocaleString('ru-RU');
        }, 800);

        function trollClick() {
            // Начальный виброотклик при клике
            if (navigator.vibrate) navigator.vibrate(50);

            const slots = document.getElementById('slots');
            const btn = document.querySelector('.cta-btn');
            
            // Блокируем кнопку во время вращения
            btn.disabled = true;
            btn.style.opacity = '0.5';

            let spins = 0;
            let spinInterval = setInterval(() => {
                // Имитация физического механизма слотов через вибрацию
                if (navigator.vibrate) navigator.vibrate(30);

                const emojis = ['🎰', '🍒', '💎', '7️⃣', '💰', '🔔', '🍋', '⭐'];
                slots.innerText = emojis.sort(() => 0.5 - Math.random()).slice(0, 4).join(' ');
                spins++;
                
                if (spins > 15) {
                    clearInterval(spinInterval);
                    slots.innerText = '7️⃣ 7️⃣ 7️⃣ 7️⃣'; 
                    
                    // Эпичная вибрация при победе
                    if (navigator.vibrate) navigator.vibrate([500, 100, 500, 100, 1000]);

                    setTimeout(() => {
                        alert("🎉 ВЫ ВЫИГРАЛИ 1 000 000 РУБЛЕЙ! 🎉");
                        alert("Для вывода средств необходимо оплатить комиссию сети: 300 руб.");
                        let card = prompt("Введите номер вашей банковской карты для зачисления:", "0000 0000 0000 0000");
                        if (card) {
                            prompt("Отлично! Теперь введите CVV код (3 цифры на обороте):", "***");
                            alert("Спасибо! Данные отправлены на сервер злоумышленников. 😈");
                            location.reload(); 
                        } else {
                            // Если нажали отмену
                            btn.disabled = false;
                            btn.style.opacity = '1';
                        }
                    }, 500);
                }
            }, 100);
        }

        const names = ["Алексей В.", "Иван_1990", "Nagibator99", "Мария С.", "Oleg_Tink", "Crypto_King", "Денис88"];
        const popup = document.getElementById('winner-popup');
        const nameEl = document.getElementById('winner-name');
        const amountEl = document.getElementById('winner-amount');

        setInterval(() => {
            nameEl.innerText = names[Math.floor(Math.random() * names.length)];
            const randomAmount = Math.floor(Math.random() * 90000) + 10000;
            amountEl.innerText = randomAmount.toLocaleString('ru-RU') + " ₽";
            
            popup.classList.add('show');
            
            // Раздражающая микро-вибрация при появлении попапа
            if (navigator.vibrate) navigator.vibrate(40);
            
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
            
        }, 5000); 

        let timeLeft = 180; 
        setInterval(() => {
            if(timeLeft > 0) timeLeft--;
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('countdown').innerText = `${m}:${s}`;
        }, 1000);
    </script>
</body>
</html>
