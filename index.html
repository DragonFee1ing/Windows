<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Системное уведомление / System Alert</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; /* Запрещаем скролл, чтобы жертва не сбежала[cite: 12] */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Имитация проверки Cloudflare при загрузке */
        .fake-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }
        
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Основной контейнер ловушки */
        .scam-container {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .alert-icon {
            font-size: 4em;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .title {
            font-size: 2em;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ef4444, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            font-size: 1.1em;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .timer-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .timer {
            color: var(--danger);
            font-weight: 900;
            font-size: 1.5em;
            font-variant-numeric: tabular-nums;
        }
        
        .timer.blink { animation: blinker 0.3s linear infinite; } /*[cite: 12] */
        @keyframes blinker { 50% { opacity: 0; } } /*[cite: 12] */

        /* Смертоносная кнопка */
        .btn-wrapper {
            position: relative;
            height: 60px;
            width: 100%;
        }

        .runaway-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
            white-space: nowrap;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1); /* Плавный отскок */
            z-index: 100;
        }

        /* Современные фейковые уведомления */
        .modern-toast {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-start;
            gap: 15px;
            z-index: 9999;
            width: 320px;
            max-width: 90vw; /* Адаптив для окон[cite: 12] */
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        @keyframes slideIn {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .toast-icon { font-size: 1.5em; }
        .toast-content { flex: 1; }
        .toast-title { font-weight: bold; font-size: 0.9em; margin-bottom: 5px; color: var(--danger); }
        .toast-msg { font-size: 0.85em; color: var(--text-muted); }
        .toast-close { color: #64748b; font-weight: bold; padding-left: 10px; }

        @media (max-width: 600px) { /* МОБИЛЬНЫЙ АДАПТИВ[cite: 12] */
            .title { font-size: 1.5em; }
            .scam-container { padding: 30px 20px; }
            .runaway-btn { font-size: 1.1em; padding: 12px 24px; }
        }
    </style>
</head>
<body>

    <!-- Фейковый лоадер -->
    <div class="fake-loader" id="loader">
        <div class="spinner"></div>
        <h2>Проверка безопасности подключения...</h2>
        <p style="color: #666; margin-top: 10px;">Пожалуйста, подождите, мы проверяем ваш браузер.</p>
    </div>

    <!-- Основной контент -->
    <div class="scam-container">
        <div class="alert-icon">🎁</div>
        <div class="title">ВЫ ВЫИГРАЛИ IPHONE 30 PRO MAX!</div> <!--[cite: 12] -->
        <div class="desc">
            Ваш IP-адрес был выбран <b style="color: var(--success);">СЛУЧАЙНО!</b> Наш алгоритм определил вас как победителя акции. <!--[cite: 12] -->
        </div>
        
        <div class="timer-box">
            Резерв приза истекает через:<br>
            <span class="timer" id="timer">10:00</span> <!--[cite: 12] -->
        </div>

        <div class="btn-wrapper" id="arena">
            <button class="runaway-btn" id="runaway">ЗАБРАТЬ ПРИЗ!!!</button> <!--[cite: 12] -->
        </div>
    </div>

    <script>
        // 1. Имитация снятия защиты Cloudflare
        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
                
                // Легкая вибрация, когда появляется сам скам
                if (navigator.vibrate) navigator.vibrate(100);
            }, 2500);
        };

        // 2. Логика плавно убегающей кнопки (60 FPS)
        const btn = document.getElementById('runaway');
        const arena = document.getElementById('arena');
        let currentX = -50; // В процентах от центра
        let currentY = -50;

        function moveButton(e) {
            if (e.type === 'touchstart') {
                e.preventDefault(); // Блокируем тап, чтобы кнопка успела убежать[cite: 12]
                if (navigator.vibrate) navigator.vibrate(50); // Микро-вибрация[cite: 12]
            }

            // Переводим кнопку в fixed для свободного полета по всему экрану
            btn.style.position = 'fixed';
            
            // Вычисляем случайную позицию в пределах видимости
            const maxX = window.innerWidth - btn.offsetWidth;
            const maxY = window.innerHeight - btn.offsetHeight;
            
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));
            
            // Используем transform для идеальной плавности
            btn.style.left = '0';
            btn.style.top = '0';
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        btn.addEventListener('mouseenter', moveButton); //[cite: 12]
        btn.addEventListener('touchstart', moveButton, { passive: false }); //[cite: 12]

        // Если чудом удалось кликнуть (или нажали через Tab+Enter)
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            triggerTrap(); //[cite: 12]
        });

        // 3. Логика ловушки
        const spamUrls = [
            "casino.html", //[cite: 12]
            "prn.html", //[cite: 12]
            "arabADS.html", //[cite: 12]
            "free_robux_generator.html", //[cite: 12]
            "cryptoscam.html", //[cite: 12]
            "enlarge_your_pc.html", //[cite: 12]
            "magic_taro_oracle.html", //[cite: 12]
            "hot_singles_in_your_area.html" //[cite: 12]
        ];

        function getRandomSpamUrl() {
            return spamUrls[Math.floor(Math.random() * spamUrls.length)]; //[cite: 12]
        }

        let isTrapped = false;
        function triggerTrap() {
            if (navigator.vibrate) {
                navigator.vibrate([300, 100, 400, 100, 500]); // Агрессивная вибрация в качестве наказания за клик[cite: 12]
            }

            // Открываем новую вкладку[cite: 12]
            window.open(getRandomSpamUrl(), '_blank');
            
            // Спавним окна на текущей[cite: 12]
            for(let i = 0; i < 4; i++) {
                setTimeout(createToast, i * 300);
            }
        }

        // Перехватываем клик мимо кнопки
        document.body.addEventListener('click', (e) => {
            if (e.target.id !== 'runaway' && document.getElementById('loader').style.display === 'none') {
                triggerTrap();
            }
        });

        // 4. Генератор современных фейковых окон
        const messages = [
            { icon: "🚨", title: "КРИТИЧЕСКАЯ УГРОЗА", text: "Обнаружен вирус Win32.Trojan.Lol" }, //[cite: 12]
            { icon: "💋", title: "НОВОЕ СООБЩЕНИЕ", text: "HOT SINGLES IN YOUR AREA WANT TO CHAT" }, //[cite: 12]
            { icon: "⚠️", title: "СИСТЕМНАЯ ОШИБКА", text: "Нехватка виртуальной памяти. Системный диск перегружен." }, //[cite: 12]
            { icon: "💳", title: "ОШИБКА ОПЛАТЫ", text: "Ваша транзакция отклонена. Обновите данные." }
        ];

        function createToast() {
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

            const toast = document.createElement('div');
            toast.className = 'modern-toast';
            
            // Безопасный расчет координат[cite: 12]
            const maxLeft = Math.max(10, window.innerWidth - 340);
            const maxTop = Math.max(10, window.innerHeight - 100);
            
            toast.style.left = Math.random() * maxLeft + 'px'; //[cite: 12]
            toast.style.top = Math.random() * maxTop + 'px'; //[cite: 12]
            
            const msg = messages[Math.floor(Math.random() * messages.length)]; //[cite: 12]
            
            toast.innerHTML = `
                <div class="toast-icon">${msg.icon}</div>
                <div class="toast-content">
                    <div class="toast-title">${msg.title}</div>
                    <div class="toast-msg">${msg.text}</div>
                </div>
                <div class="toast-close">✕</div>
            `;
            
            // Нажатие на крестик только создает новые окна[cite: 12]
            toast.addEventListener('click', (e) => {
                e.stopPropagation(); // Не даем всплыть до body
                toast.remove();
                triggerTrap(); //[cite: 12]
            });
            
            document.body.appendChild(toast); //[cite: 12]
        }

        // Автоматический спам окнами
        setInterval(() => {
            if(document.getElementById('loader').style.display === 'none') {
                createToast();
            }
        }, 2000);

        // 5. Фейковый таймер[cite: 12]
        let timeLeft = 600; //[cite: 12]
        const timerEl = document.getElementById('timer'); //[cite: 12]
        setInterval(() => {
            if (timeLeft > 0 && document.getElementById('loader').style.display === 'none') {
                timeLeft--; //[cite: 12]
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0'); //[cite: 12]
                const s = (timeLeft % 60).toString().padStart(2, '0'); //[cite: 12]
                timerEl.innerText = `${m}:${s}`; //[cite: 12]
                
                if (timeLeft < 50) timerEl.classList.add('blink'); //[cite: 12]
            }
        }, 1000); // Поставил 1000мс (реальная секунда), чтобы выглядело достовернее

        // 6. Засада по времени (pop-under)[cite: 12]
        setTimeout(() => {
            if(document.getElementById('loader').style.display === 'none') {
                let sneakyWindow = window.open(getRandomSpamUrl(), '_blank', 'width=800,height=600'); //[cite: 12]
                if (sneakyWindow) {
                    sneakyWindow.blur(); //[cite: 12]
                    window.focus(); //[cite: 12]
                }
            }
        }, 12000); 
    </script>
</body>
</html>
