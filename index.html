<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>!!! ВЫ ПОБЕДИТЕЛЬ !!!</title>
    <style>
        body {
            background-color: #ff00ff;
            color: #ffff00;
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            margin: 0;
            overflow: hidden; /* Запрещаем скролл, чтобы жертва не сбежала */
            user-select: none;
            -webkit-user-select: none;
        }

        .blink {
            animation: blinker 0.2s linear infinite;
        }
        
        @keyframes blinker {
            50% { opacity: 0; }
        }

        .marquee-container {
            font-size: 3em;
            font-weight: bold;
            background: red;
            color: yellow;
            border: 5px dashed lime;
            padding: 10px;
        }

        .hero-text {
            text-align: center;
            font-size: 4em;
            text-shadow: 5px 5px 0px blue, -2px -2px 0px black;
            margin-top: 50px;
            cursor: crosshair;
            padding: 0 10px;
        }

        .promo-text {
            font-size: 2em;
            text-align: center;
            background: black;
            display: block;
            width: 100%;
            margin: 0;
            padding: 15px 10px;
            box-sizing: border-box;
        }

        /* Кнопка, которая убегает от курсора и пальца */
        .runaway-btn {
            position: absolute;
            font-size: 2.5em;
            font-weight: bold;
            background: lime;
            color: red;
            border: 10px ridge gold;
            padding: 20px;
            cursor: pointer;
            box-shadow: 10px 10px 30px #000;
            transition: 0.1s ease-out; /* Немного плавности для побега */
            z-index: 10;
            white-space: nowrap;
        }

        /* Фейковые всплывающие окна */
        .fake-popup {
            position: absolute;
            border: 3px solid #0000aa;
            background: #c0c0c0;
            color: #000;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
            z-index: 999;
            font-family: "Courier New", Courier, monospace;
            width: 320px;
            max-width: 90vw; /* Адаптив для окон */
        }

        .popup-header {
            background: #0000aa;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .popup-content {
            padding: 15px;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
        }

        .popup-btn {
            background: #c0c0c0;
            border: 2px outset #fff;
            padding: 5px 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .popup-btn:active {
            border: 2px inset #fff;
        }

        /* МОБИЛЬНЫЙ АДАПТИВ */
        @media (max-width: 600px) {
            .marquee-container {
                font-size: 1.5em;
                border-width: 3px;
                padding: 5px;
            }
            .hero-text {
                font-size: 2.2em;
                margin-top: 20px;
                text-shadow: 3px 3px 0px blue, -1px -1px 0px black;
            }
            .promo-text {
                font-size: 1.2em;
                padding: 10px 5px;
            }
            .runaway-btn {
                font-size: 1.5em;
                padding: 15px;
                border-width: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <!-- Агрессивно быстрая бегущая строка -->
        <marquee direction="right" scrollamount="40">СКАЧАТЬ БЕСПЛАТНО БЕЗ СМС И РЕГИСТРАЦИИ!!! 100% БЕЗ ВИРУСОВ!!! 🔥🔥🔥</marquee>
    </div>

    <h1 class="hero-text blink">🔥 ВЫ ВЫИГРАЛИ IPHONE 30 PRO MAX 🔥</h1>
    
    <p class="promo-text">
        Ваш IP-адрес был выбран <span style="color: lime;">СЛУЧАЙНО!</span> Кликните ниже, чтобы забрать приз до того, как истечет таймер: <span id="timer" style="color: red;">10:00</span>
    </p>

    <!-- Эта кнопка будет убегать -->
    <button id="runaway" class="runaway-btn" style="top: 50%; left: 10%;">ЗАБРАТЬ ПРИЗ!!!</button>

    <script>
        // 1. Приветственный спам алертами
        window.onload = () => {
            setTimeout(() => {
                alert("ВНИМАНИЕ! ВЫ СТАЛИ 1,000,000-м ПОСЕТИТЕЛЕМ СЕТИ!");
                alert("Нажмите ОК чтобы забрать ваш приз!");
                alert("Подключение к зашифрованному серверу выдачи призов...");
                alert("Проверка анти-бот пройдена!");
                alert("Одобрено! У вас есть 10 минут, чтобы нажать на кнопку!");
            }, 500);
        };

        // 2. Логика убегающей кнопки (теперь и для тачскринов)
        const btn = document.getElementById('runaway');
        
        function moveButton(e) {
            if (e.type === 'touchstart') {
                e.preventDefault(); // Блокируем тап, чтобы кнопка успела убежать
                // Микро-вибрация, чтобы казалось, что кнопка "вырывается"
                if (navigator.vibrate) navigator.vibrate(50); 
            }

            // Вычисляем случайные координаты, не давая кнопке вылезти за экран
            const maxX = Math.max(0, window.innerWidth - btn.offsetWidth - 20);
            const maxY = Math.max(0, window.innerHeight - btn.offsetHeight - 20);
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;
        }

        btn.addEventListener('mouseenter', moveButton);
        btn.addEventListener('touchstart', moveButton, { passive: false });

        // Если чудом удалось кликнуть
        btn.addEventListener('click', () => {
            alert("ОШИБКА СЕРВЕРА 0x0000007B!");
            alert("Кто-то другой пытается перехватить ваш приз! ПОВТОРИТЕ ПОПЫТКУ!");
            triggerTrap();
        });

        // 3. Логика случайных спам-ссылок
        const spamUrls = [
            "casino.html",
            "prn.html",
            "arabADS.html",
            "free_robux_generator.html",
            "cryptoscam.html",
            "enlarge_your_pc.html",
            "magic_taro_oracle.html",
            "hot_singles_in_your_area.html"
        ];

        function getRandomSpamUrl() {
            return spamUrls[Math.floor(Math.random() * spamUrls.length)];
        }

        // Ловушка: открывает новую вкладку и генерирует еще больше окон на текущей
        function triggerTrap() {
            // Агрессивная вибрация в качестве наказания за клик
            if (navigator.vibrate) {
                navigator.vibrate([300, 100, 400, 100, 500]);
            }

            let url = getRandomSpamUrl();
            window.open(url, '_blank', 'width=700,height=600');
            
            // Наказание за попытку закрыть окно: спавним еще 3 новых!
            for(let i = 0; i < 3; i++) {
                setTimeout(createPopup, i * 200); 
            }
        }

        // 4. Генератор фейковых окон Windows (бесконечный спам-режим)
        const messages = [
            "⚠️ ВНИМАНИЕ! Обнаружен вирус Win32.Trojan.Lol",
            "Ваша лицензия WinRAR недействительна!",
            "HOT SINGLES IN YOUR AREA WANT TO CHAT",
            "ОШИБКА 404: Системный диск перегружен",
            "Ваш жесткий диск будет отформатирован через 5 секунд",
            "КРИТИЧЕСКАЯ ОШИБКА: Нехватка виртуальной памяти"
        ];

        // Токсичные цвета для фона окон
        const uglyColors = ["#c0c0c0", "#ff99cc", "#ccffcc", "#ffff99", "#ffcc99", "#00ffff"];

        function createPopup() {
            // Раздражающая двойная вибрация при появлении каждого окна
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }

            const popup = document.createElement('div');
            popup.className = 'fake-popup';
            
            const bgColor = uglyColors[Math.floor(Math.random() * uglyColors.length)];
            popup.style.backgroundColor = bgColor;
            
            // Безопасный расчет координат для мобилок
            const maxLeft = Math.max(0, window.innerWidth - 320);
            const maxTop = Math.max(0, window.innerHeight - 150);
            
            popup.style.left = Math.random() * maxLeft + 'px';
            popup.style.top = Math.random() * maxTop + 'px';
            
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            
            popup.innerHTML = `
                <div class="popup-header">
                    <span>Системное сообщение</span>
                    <span style="cursor:pointer; background: red; padding: 0 5px; border: 1px solid white;" onclick="triggerTrap()">X</span>
                </div>
                <div class="popup-content">
                    <b>${randomMsg}</b><br>
                    <button class="popup-btn" onclick="triggerTrap()">ОК</button>
                </div>
            `;
            
            document.body.appendChild(popup);
        }

        // Запускаем автоматическое появление окон каждую 1.5 секунды
        setInterval(createPopup, 1500); 

        // 5. Фейковый таймер (ускоряется к концу)
        let timeLeft = 600;
        const timerEl = document.getElementById('timer');
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                timerEl.innerText = `${m}:${s}`;
                
                // Таймер начинает бешено мигать, когда "времени" остается мало
                if (timeLeft < 50) timerEl.classList.add('blink');
            }
        }, 100);

        // 6. Засада по времени: через 8 секунд открываем первую спам-ссылку в фоне
        setTimeout(() => {
            let url = getRandomSpamUrl();
            let sneakyWindow = window.open(url, '_blank', 'width=800,height=600');
            
            if (sneakyWindow) {
                sneakyWindow.blur();
                window.focus();
            }
            createPopup();
        }, 8000); 
    </script>
</body>
</html>
